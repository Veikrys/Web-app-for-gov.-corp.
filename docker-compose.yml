version: '3.8'

services:
  # MySQL вместо PostgreSQL
  mysql:
    image: mysql:8
    container_name: my_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '12345'
      MYSQL_DATABASE: ufk
      MYSQL_USER: root
      MYSQL_PASSWORD: '12345'
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # Опционально:init.sql для начальных данных

  # Backend
  backend:
    build: ./backend
    container_name: my_backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: '12345'
      DB_NAME: ufk
    depends_on:
      - mysql
  
  frontend:
    build: ./frontend
    container_name: my_frontend

  # phpMyAdmin вместо pgAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: my_phpmyadmin
    restart: always
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql

  # NGINX + React
  nginx:
    image: nginx:alpine
    container_name: my_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
      - phpmyadmin

volumes:
  mysql_data: